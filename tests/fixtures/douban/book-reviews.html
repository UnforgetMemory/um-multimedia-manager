<!doctype html>
<!--
  Synthetic Douban-shaped fixture for tests/unit/book-reviews-data.spec.ts.
  NOT a real saved page — all data is fabricated. Reproduces the public DOM
  shape of https://book.douban.com/people/{uid}/reviews as queried by
  src/scenario/douban/pages/book-reviews/book-reviews-data.ts:
  #db-usr-profile (pic img alt = display name, .info h1 "书评(N)", nav ul),
  .article > div > div.tlst review containers with [id^="review_"],
  .nlst h3 > a title, .ilst subject a[title] + img, .ll.user .starb
  (author a + allstarNN rating + 阅读数/来源 spans), .review-content p /
  .review-short span, .useful_count/.useless_count, and .paginator.
  Includes an unrated full-review item, a minimal item (author falls back to
  profile name), and a promo .tlst without review id/title that must be skipped.
-->
