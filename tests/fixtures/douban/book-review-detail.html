<!doctype html>
<!--
  Synthetic Douban-shaped fixture for
  src/scenario/douban/pages/book-review-detail/book-review-detail-data.ts.
  NOT a real saved page: reviewer, ids, dates and text are fabricated.
  Same review-detail shell, book host: header.main-hd
  (h1 span[property="v:summary"] / a.avatar.author-avatar img / a span /
  div.main-meta), [class*="allstar"], .review-content.clearfix > p,
  .main-author span, .btn.useful_count / .btn.useless_count and the book
  aside (.subject-img img / .subject-title a / .subject-info .info-item
  with 作者 / 出版社 / 页数 keys).
-->
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>《繁花》书评：市井话语里的时间刻度</title>
  </head>
  <body>
    <div id="content">
      <div class="grid-16-8 clearfix">
        <div class="article">
          <div id="maininfo">
            <div id="link-report">
              <div class="pre">
                <header class="main-hd">
                  <h1 class="main-title">
                    <span class="itemtitle" property="v:summary">市井话语里的时间刻度</span>
                  </h1>
                  <a href="https://book.douban.com/people/unforgetmemory/" class="avatar author-avatar">
                    <img src="https://img3.doubanio.com/icon/u150361821-2.jpg" class="icon-image" alt="UnforgetMemory" />
                  </a>
                  <a class="author-name" href="https://book.douban.com/people/unforgetmemory/"
                    ><span class="display-name">UnforgetMemory</span></a
                  >
                  <div class="main-meta">
                    <span class="time" content="2021-05-07 09:12:44">2021-05-07 09:12:44</span>
                    <span class="user-rating"
                      ><span class="allstar45 rl" title="推荐"></span
                    ></span>
                    <span class="ip-location">(杭州)</span>
                  </div>
                </header>
              </div>

              <div class="review-content clearfix">
                <p>金宇澄把评话的口气缝进现代叙事，读起来像有人在耳边讲故事。</p>
                <p>不响不是沉默，是一种留白的叙事权。</p>
                <p></p>
              </div>

              <div class="main-author">
                <span class="pl">632人阅读</span>
                <span class="pl"> 来自 读书号</span>
              </div>

              <div class="action">
                <a href="javascript:void(0)" class="btn useful_count"
                  ><i class="ico22 upt"></i>有用<span class="count">27</span></a
                >
                <a href="javascript:void(0)" class="btn useless_count"
                  ><i class="ico22 downt"></i>没用<span class="count">1</span></a
                >
              </div>
            </div>
          </div>
        </div>

        <div class="aside">
          <div class="subject-img">
            <a href="https://book.douban.com/subject/6781208/">
              <img src="https://img1.doubanio.com/view/subject/s/public/s6941968.jpg" alt="繁花" width="84" />
            </a>
          </div>
          <div class="subject-title">
            <a href="https://book.douban.com/subject/6781208/">&gt; 繁花</a>
          </div>
          <div class="subject-info">
            <div class="info-item"><span class="info-item-key">作者:</span><span class="info-item-val">金宇澄</span></div>
            <div class="info-item"><span class="info-item-key">出版社:</span><span class="info-item-val">上海文艺出版社</span></div>
            <div class="info-item"><span class="info-item-key">出品方:</span><span class="info-item-val">理想国</span></div>
            <div class="info-item"><span class="info-item-key">页数:</span><span class="info-item-val">363</span></div>
            <div class="info-item"><span class="info-item-key">定价:</span><span class="info-item-val">36.00元</span></div>
            <div class="info-item"><span class="info-item-key">装帧:</span><span class="info-item-val">平装</span></div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
