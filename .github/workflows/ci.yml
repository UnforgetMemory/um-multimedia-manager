name: CI Build

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'icons/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'icons/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # 单一事实源：Node 版本由 .nvmrc 决定（本地 nvm/fnm 与 CI 一致）
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - run: npm run type-check

  static-gates:
    name: Static Gates
    needs: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      # 架构分层守卫（ADR-026 D6）：七层依赖方向单向向下，禁止向上/反向依赖
      - run: npm run arch:check
      # 设计令牌门禁（ADR-018/019/020）：三层令牌 + 对比度/明暗对称断言
      - run: npm run ds:check
      # 样式作用域守卫（ADR-026 D7）：legacy 内容样式注入宿主页面，禁止裸选择器
      - run: npm run scope:check
      # i18n 键完整性：SPA + 内容脚本两套系统
      - run: npm run i18n:check
      # 静态 lint（ADR-026 D8）：oxlint 正确性规则，零警告门禁
      - run: npm run lint

  build:
    name: Build (${{ matrix.browser }})
    needs: [typecheck, static-gates]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        browser: [chrome, firefox]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - run: npx wxt build -b ${{ matrix.browser }}
      - name: Fix paths (Chrome only)
        if: matrix.browser == 'chrome'
        run: node scripts/fix-paths.js
